<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;background:#1D1D1D;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;color:var(--color-text-primary);border-radius:4px;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-2);font-size:14px;max-width:480px}
.toast .ico{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.toast.pos .ico{background:var(--color-positive)}
.toast.neg .ico{background:var(--color-negative)}
.toast.warn .ico{background:var(--color-warning);color:var(--color-dark)}
.toast.info .ico{background:var(--color-info);color:var(--color-dark)}
.toast.ongoing .ico{background:var(--color-primary)}
.toast .material-icons{font-family:'Material Symbols Outlined';font-style:normal;font-size:16px}
.toast b{font-weight:500}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card">
  <div class="toast pos"><div class="ico"><span class="material-icons">check</span></div>Content published.</div>
  <div class="toast neg"><div class="ico"><span class="material-icons">close</span></div>Could not save — try again.</div>
  <div class="toast warn"><div class="ico"><span class="material-icons">warning</span></div>3 days left on your trial.</div>
  <div class="toast info"><div class="ico"><span class="material-icons">info</span></div>QR code regenerated.</div>
  <div class="toast ongoing"><div class="ico"><span class="material-icons spin">refresh</span></div><b>Uploading assets…</b></div>
</div>
</body></html>
