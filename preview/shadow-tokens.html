<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;background:#F5F5F5}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile .box{width:90px;height:90px;background:#fff;border-radius:10px}
.tile b{font-family:var(--font-mono);font-size:11px;color:var(--color-text-secondary)}
.tile span{font-size:13px;font-weight:500}
</style></head><body>
<div class="card">
  <div class="tile"><div class="box" style="box-shadow:none;border:1px solid var(--color-divider)"></div><span>shadow-0 ★</span><b>cards default</b></div>
  <div class="tile"><div class="box" style="box-shadow:var(--shadow-1)"></div><span>shadow-1</span><b>sticky header</b></div>
  <div class="tile"><div class="box" style="box-shadow:var(--shadow-2)"></div><span>shadow-2</span><b>menus · toasts</b></div>
  <div class="tile"><div class="box" style="box-shadow:var(--shadow-4)"></div><span>shadow-4</span><b>dialogs</b></div>
</div>
</body></html>
