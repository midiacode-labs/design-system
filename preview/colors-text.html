<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:#fff;border:1px solid var(--color-divider);border-radius:8px;padding:14px}
.tile .sample{font-size:18px;font-weight:500;margin-bottom:6px}
.tile .tk{font-family:var(--font-mono);font-size:11px;color:var(--color-text-secondary)}
</style></head><body>
<div class="card">
  <div class="tile"><div class="sample" style="color:rgba(0,0,0,0.87)">Primary text</div><div class="tk">rgba(0,0,0,.87)</div></div>
  <div class="tile"><div class="sample" style="color:rgba(0,0,0,0.60)">Secondary</div><div class="tk">rgba(0,0,0,.60)</div></div>
  <div class="tile"><div class="sample" style="color:rgba(0,0,0,0.38)">Disabled</div><div class="tk">rgba(0,0,0,.38)</div></div>
  <div class="tile" style="background:#1D1D1D"><div class="sample" style="color:#fff">On dark</div><div class="tk" style="color:rgba(255,255,255,.7)">#FFFFFF</div></div>
</div>
</body></html>
