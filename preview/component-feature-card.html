<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;background:#F5F5F5;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.feature{background:rgba(239,239,239,.6);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;border:1px solid rgba(0,0,0,.04)}
.feature .ico{width:40px;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--color-primary)}
.feature .t{font-size:16px;font-weight:500}
.feature .d{font-size:13px;color:var(--color-text-secondary);line-height:1.5}
.feature .b{margin-top:auto;display:flex;gap:8px}
.btn{font-family:var(--font-family);font-weight:500;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:0 14px;height:32px;border:1px solid var(--color-primary);background:transparent;color:var(--color-primary);cursor:pointer}
.material-icons{font-family:'Material Symbols Outlined';font-style:normal;font-size:22px}
</style></head><body>
<div class="card">
  <div class="feature">
    <div class="ico"><span class="material-icons">qr_code_2</span></div>
    <div class="t">Dynamic QR codes</div>
    <div class="d">Change where a code points without reprinting. Add audience, schedule and A/B rules.</div>
    <div class="b"><button class="btn">Watch</button></div>
  </div>
  <div class="feature">
    <div class="ico"><span class="material-icons">insights</span></div>
    <div class="t">Live scan analytics</div>
    <div class="d">See scans by city, device and campaign in real time. Filter to any time window.</div>
    <div class="b"><button class="btn">Watch</button></div>
  </div>
</div>
</body></html>
