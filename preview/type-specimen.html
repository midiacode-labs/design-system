<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="_preview.css">
  <style>
    .card { padding:24px; display:flex; gap:24px; align-items:center; }
    .specimen { flex:1; }
    .big {
      font-size:72px;
      line-height:1.05;
      letter-spacing:-0.02em;
      color:var(--color-text-primary);
    }
    .big .l { font-weight:300; display:block; }
    .big .b { font-weight:700; display:block; }
    .pangram { font-size:16px; font-weight:300; color:var(--color-text-secondary); margin-top:14px; max-width:520px; line-height:1.5; }
    .pangram b { font-weight:700; color:var(--color-text-primary); }
    .meta {
      width:170px;
      display:flex;
      flex-direction:column;
      gap:6px;
      font-family:var(--font-mono);
      font-size:11px;
      color:var(--color-text-secondary);
    }
    .meta b { font-family:var(--font-family); font-size:14px; font-weight:700; color:var(--color-text-primary); }
    .meta .l { font-weight:300; }
  </style>
</head>
<body>
  <div class="card">
    <div class="specimen">
      <div class="big">
        <span class="l">Open</span><span class="b">Sans</span>
      </div>
      <div class="pangram">The quick <b>brown fox</b> jumps over the lazy dog — 0123456789 · &amp; ? !</div>
    </div>
    <div class="meta">
      <b>Open Sans</b>
      <div class="l">Light · 300 ✓</div>
      <div>—— 400 (fallback)</div>
      <div>—— 500 (fallback)</div>
      <div style="font-weight:700;color:var(--color-text-primary);font-family:var(--font-family)">Bold · 700 ✓</div>
    </div>
  </div>
</body>
</html>
