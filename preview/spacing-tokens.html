<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;display:flex;align-items:flex-end;gap:18px}
.bar{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--color-text-secondary)}
.bar i{display:block;background:var(--color-primary);border-radius:2px;width:18px}
.bar b{font-family:var(--font-family);font-weight:500;color:var(--color-text-primary);font-size:12px}
</style></head><body>
<div class="card">
  <div class="bar"><i style="height:4px"></i>  <b>xs</b><span>4px</span></div>
  <div class="bar"><i style="height:8px"></i>  <b>sm</b><span>8px</span></div>
  <div class="bar"><i style="height:16px"></i> <b>md</b><span>16px</span></div>
  <div class="bar"><i style="height:24px"></i> <b>lg</b><span>24px</span></div>
  <div class="bar"><i style="height:48px"></i> <b>xl</b><span>48px</span></div>
  <div style="flex:1;border-left:1px solid var(--color-divider);padding-left:24px;align-self:stretch;display:flex;flex-direction:column;gap:6px;justify-content:flex-end">
    <div style="font-size:11px;color:var(--color-text-secondary);letter-spacing:.04em;text-transform:uppercase;font-weight:500">In use</div>
    <div style="font-size:13px;color:var(--color-text-primary);line-height:1.6">
      Page padding <b>24 (lg)</b> · card inner padding <b>16 (md)</b> · row gap <b>8 (sm)</b> · icon nudge <b>4 (xs)</b> · section break <b>48 (xl)</b>
    </div>
  </div>
</div>
</body></html>
