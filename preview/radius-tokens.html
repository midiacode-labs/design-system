<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px}
.tile .box{width:72px;height:72px;background:#fff;border:1px solid var(--color-divider)}
.tile b{font-family:var(--font-mono);font-size:11px;color:var(--color-text-secondary)}
.tile span{font-size:13px;font-weight:500}
</style></head><body>
<div class="card">
  <div class="tile"><div class="box" style="border-radius:3px"></div><span>btn</span><b>3px</b></div>
  <div class="tile"><div class="box" style="border-radius:4px"></div><span>input · table</span><b>4px</b></div>
  <div class="tile"><div class="box" style="border-radius:8px"></div><span>avatar</span><b>8px</b></div>
  <div class="tile"><div class="box" style="border-radius:10px"></div><span>card ★</span><b>10px</b></div>
  <div class="tile"><div class="box" style="border-radius:16px"></div><span>chip</span><b>16px</b></div>
  <div class="tile"><div class="box" style="border-radius:28px"></div><span>pill</span><b>28px</b></div>
  <div class="tile"><div class="box" style="border-radius:50%"></div><span>round</span><b>50%</b></div>
  <div class="tile"><div class="box" style="border-radius:0"></div><span>none</span><b>0</b></div>
</div>
</body></html>
