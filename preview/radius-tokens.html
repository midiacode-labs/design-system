<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tile .box{width:72px;height:72px;background:#fff;border:1px solid var(--color-divider)}
.tile b{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--color-text-secondary)}
.tile span{font-size:13px;font-weight:500}
</style></head><body>
<div class="card">
  <div class="tile"><div class="box" style="border-radius:3px"></div><span>button</span><b>3px · q-btn</b></div>
  <div class="tile"><div class="box" style="border-radius:4px"></div><span>card · input · table</span><b>4px · Quasar default</b></div>
  <div class="tile"><div class="box" style="border-radius:8px"></div><span>custom surface</span><b>8px · most used</b></div>
  <div class="tile"><div class="box" style="border-radius:10px"></div><span>section card</span><b>10px</b></div>
  <div class="tile"><div class="box" style="border-radius:15px"></div><span>content type card</span><b>15px · .default-border-radius</b></div>
  <div class="tile"><div class="box" style="border-radius:20% 8% 20% 20%"></div><span>workspace avatar</span><b>20% 8% 20% 20%</b></div>
  <div class="tile"><div class="box" style="border-radius:16px;height:32px;margin:20px 0"></div><span>chip</span><b>16px · q-chip</b></div>
  <div class="tile"><div class="box" style="border-radius:50%"></div><span>round</span><b>50% · icon button, avatar</b></div>
</div>
</body></html>
