<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font-family:var(--font-family);font-weight:500;font-size:14px;border-radius:3px;padding:0 16px;height:36px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;transition:var(--transition-fast)}
.btn.primary{background:var(--color-primary);color:#fff}
.btn.primary:hover{background:#1565C0}
.btn.cta{background:var(--color-cta);color:var(--color-dark)}
.btn.cta:hover{background:var(--color-cta-hover)}
.btn.flat{background:transparent;color:var(--color-primary)}
.btn.flat:hover{background:rgba(25,118,210,.08)}
.btn.outline{background:transparent;color:var(--color-primary);border:1px solid var(--color-primary)}
.btn.outline:hover{background:rgba(25,118,210,.08)}
.btn.danger{background:var(--color-negative);color:#fff}
.btn.disabled{background:#E0E0E0;color:rgba(0,0,0,.38);cursor:not-allowed}
.btn.icon{height:40px;width:40px;padding:0;border-radius:50%;background:transparent;color:#9E9E9E;font-size:20px}
.btn.icon:hover{background:rgba(0,0,0,.04)}
.material-icons{font-family:'Material Symbols Outlined';font-size:18px;font-style:normal;font-weight:normal;line-height:1}
</style></head><body>
<div class="card">
  <button class="btn primary"><span class="material-icons">add</span>Create content</button>
  <button class="btn cta">Create</button>
  <button class="btn outline">Create workspace</button>
  <button class="btn flat">Watch</button>
  <button class="btn danger">Delete</button>
  <button class="btn disabled">Save</button>
  <button class="btn icon"><span class="material-icons">more_vert</span></button>
  <button class="btn icon"><span class="material-icons">filter_list</span></button>
  <button class="btn icon"><span class="material-icons">notifications</span></button>
</div>
</body></html>
