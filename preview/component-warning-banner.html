<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:0}
.banner{height:40px;background:#F2C037;color:var(--color-dark);display:flex;align-items:center;padding:0 16px;font-size:13px;gap:8px}
.banner .material-icons{font-family:'Material Symbols Outlined';font-style:normal;font-size:18px}
.banner b{font-weight:500}
.banner .spacer{flex:1}
.banner .x{cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.banner .x:hover{background:rgba(0,0,0,.08)}
.note{padding:14px 24px;color:var(--color-text-secondary);font-size:12px;line-height:1.6}
.note code{font-family:var(--font-mono);background:rgba(0,0,0,.05);padding:1px 6px;border-radius:3px;font-size:11px}
</style></head><body>
<div class="card">
  <div class="banner">
    <span class="material-icons">warning_amber</span>
    <b>Your trial ends in 3 days.</b> Upgrade to keep publishing.
    <div class="spacer"></div>
    <a style="font-weight:500;color:inherit;text-decoration:underline;font-size:13px;margin-right:8px;cursor:pointer">UPGRADE</a>
    <div class="x"><span class="material-icons">close</span></div>
  </div>
  <div class="note">Full-width yellow <code>#F2C037</code>, height 40, dismissible. Sits above the 51 px header. Used for trial expiry, payment failures, missing workspace info.</div>
</div>
</body></html>
