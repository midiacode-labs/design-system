<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{position:relative;border:1px solid rgba(0,0,0,.24);border-radius:4px;padding:0 12px;height:56px;display:flex;align-items:center;background:#fff}
.field.focus{border-color:var(--color-primary);border-width:2px;padding:0 11px}
.field.error{border-color:var(--color-negative);border-width:2px;padding:0 11px}
.field label{position:absolute;top:-8px;left:10px;font-size:12px;background:#fff;padding:0 4px;color:var(--color-text-secondary)}
.field.focus label{color:var(--color-primary)}
.field.error label{color:var(--color-negative)}
.field input{border:0;outline:0;width:100%;font-family:inherit;font-size:14px;background:transparent;color:var(--color-text-primary)}
.help{font-size:11px;color:var(--color-text-secondary);margin-top:4px;margin-left:12px}
.help.err{color:var(--color-negative)}
.standout{background:rgba(0,0,0,.05);border-radius:4px;padding:0 12px;height:40px;display:flex;align-items:center;gap:8px}
.standout input{border:0;outline:0;background:transparent;flex:1;font-family:inherit;font-size:14px}
.material-icons{font-family:'Material Symbols Outlined';font-style:normal;color:rgba(0,0,0,.6)}
</style></head><body>
<div class="card">
  <div>
    <div class="field"><label>Content title</label><input value="Spring Menu 2026"></div>
    <div class="help">Outlined · default</div>
  </div>
  <div>
    <div class="field focus"><label>Tags</label><input value="menu, qr, spring"></div>
    <div class="help">Outlined · focused</div>
  </div>
  <div>
    <div class="field error"><label>Slug</label><input value="spring menu"></div>
    <div class="help err">Lowercase, no spaces.</div>
  </div>
  <div>
    <div class="standout"><span class="material-icons">search</span><input placeholder="Search content, tags, authors"></div>
    <div class="help">Standout · header search bar</div>
  </div>
</div>
</body></html>
