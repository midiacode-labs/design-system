<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;background:#F5F5F5;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.content-card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;transition:var(--transition-fast)}
.thumb{height:120px;background:linear-gradient(135deg,#1976D2,#42A5F5);position:relative}
.thumb.b{background:linear-gradient(135deg,#0D47A1,#1976D2)}
.thumb.c{background:#FFD600}
.thumb .badge{position:absolute;top:10px;right:10px;height:22px;padding:0 10px;border-radius:16px;font-size:11px;font-weight:500;display:inline-flex;align-items:center}
.pub{background:var(--color-positive);color:#fff}
.draft{background:var(--color-warning);color:var(--color-dark)}
.arch{background:var(--color-dark);color:#fff}
.body{padding:14px 16px}
.body .title{font-size:16px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;line-height:1.3}
.meta{font-size:12px;color:var(--color-text-secondary)}
.material-icons{font-family:'Material Symbols Outlined';font-style:normal;color:rgba(255,255,255,.85);font-size:40px;position:absolute;left:16px;bottom:16px}
</style></head><body>
<div class="card">
  <div class="content-card">
    <div class="thumb"><span class="material-icons">restaurant_menu</span><span class="badge pub">Published</span></div>
    <div class="body"><div class="title">Spring Menu 2026</div><div class="meta">Lara Chen · Apr 14</div></div>
  </div>
  <div class="content-card">
    <div class="thumb b"><span class="material-icons">view_in_ar</span><span class="badge draft">Draft</span></div>
    <div class="body"><div class="title">AR Try-On — Sneakers</div><div class="meta">Marco Torres · Apr 12</div></div>
  </div>
  <div class="content-card">
    <div class="thumb c"><span class="material-icons" style="color:rgba(0,0,0,.7)">campaign</span><span class="badge arch">Archived</span></div>
    <div class="body"><div class="title">Holiday Q4 Campaign</div><div class="meta">Priya N. · Dec 3, 2025</div></div>
  </div>
</div>
</body></html>
