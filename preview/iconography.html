<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"><link rel="stylesheet" href="_preview.css"><style>
.card{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col h3{font-size:11px;color:var(--color-text-secondary);letter-spacing:.04em;text-transform:uppercase;font-weight:500;margin:0 0 10px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ico{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(0,0,0,.7);font-size:10px;font-family:var(--font-mono)}
.ico .material-icons,.ico .material-icons-outlined,.ico .material-symbols-outlined{font-size:22px}
.material-icons{font-family:'Material Symbols Outlined'}
.material-icons-outlined{font-family:'Material Symbols Outlined'}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
</style></head><body>
<div class="card">
  <div class="col">
    <h3>Material Icons (filled · default)</h3>
    <div class="row">
      <div class="ico"><span class="material-icons">add</span>add</div>
      <div class="ico"><span class="material-icons">search</span>search</div>
      <div class="ico"><span class="material-icons">qr_code_2</span>qr_code_2</div>
      <div class="ico"><span class="material-icons">insights</span>insights</div>
      <div class="ico"><span class="material-icons">groups</span>groups</div>
      <div class="ico"><span class="material-icons">settings</span>settings</div>
    </div>
  </div>
  <div class="col">
    <h3>Outlined &amp; Symbols</h3>
    <div class="row">
      <div class="ico"><span class="material-icons-outlined">add_box</span>o_add_box</div>
      <div class="ico"><span class="material-icons-outlined">notifications</span>o_notifs</div>
      <div class="ico"><span class="material-symbols-outlined">qr_code_scanner</span>sym_o_scan</div>
      <div class="ico"><span class="material-symbols-outlined">campaign</span>sym_o_camp</div>
      <div class="ico"><span class="material-symbols-outlined">view_in_ar</span>sym_o_ar</div>
      <div class="ico"><span class="material-symbols-outlined">restaurant_menu</span>sym_o_menu</div>
    </div>
  </div>
</div>
</body></html>
