<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>Midiacode Studio — UI Kit</title>
  <link rel="stylesheet" href="studio.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    let toastSeq = 0;

    function App() {
      const [view, setView]         = useState("library");   // library | detail | settings | qrcodes | analytics | audiences | integrations | help
      const [openItem, setOpenItem] = useState(null);
      const [drawer, setDrawer]     = useState(false);
      const [tab, setTab]           = useState("all");
      const [toasts, setToasts]     = useState([]);

      const pushToast = (type, message) => {
        const id = ++toastSeq;
        setToasts(t => [...t, { id, type, message }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
      };

      const openDetail = (item) => { setOpenItem(item); setView("detail"); };
      const backToLib  = () => { setOpenItem(null); setView("library"); };

      const handleCreate = (data) => {
        setDrawer(false);
        pushToast("ongoing", `Creating "${data.title}"…`);
        setTimeout(() => pushToast("pos", "Content created."), 900);
      };

      const [workspace, setWorkspace] = useState("acme");
      const [mode, setMode]           = useState("gallery");
      const current = WORKSPACES.find(w => w.id === workspace);

      return (
        <div className="app">
          {view !== "settings" && (
            <PrimarySidebar
              current={workspace}
              onSelect={(id) => { setWorkspace(id); backToLib(); }}
              onHome={backToLib}
              onSearch={() => pushToast("info", "Workspace search dialog: not in this kit.")}
              onAdd={() => pushToast("info", "Create workspace: not in this kit.")}
            />
          )}
          <div className="main-col">
            <AppHeader
              onCreate={() => setDrawer(true)}
              onFilters={() => pushToast("info", "Search filters menu: not in this kit.")}
              onAvatarClick={() => setView(view === "settings" ? "library" : "settings")}
            />
            {view === "library" && (
              <WorkspaceHeader
                name={current.name}
                trial="3 days 4 hours and 12 minutes"
                mode={mode}
                onMode={setMode}
                onSettings={() => setView("settings")}
                onUpgrade={() => pushToast("info", "Opening the upgrade page.")}
              />
            )}
            {view === "library"  && <ContentLibraryScreen onOpen={openDetail} onCreate={() => setDrawer(true)} tab={tab} setTab={setTab} />}
            {view === "detail"   && openItem && <ContentDetailScreen item={openItem} onBack={backToLib} onPublish={() => { pushToast("pos", "Content published."); backToLib(); }} onArchive={() => { pushToast("warn", "Content archived."); backToLib(); }} />}
            {view === "settings" && <SettingsScreen />}
          </div>
          {drawer && <CreateContentDrawer onClose={() => setDrawer(false)} onCreate={handleCreate} />}
          <ToastStack items={toasts} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
